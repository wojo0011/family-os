name: CI and GitHub Pages

on:
  push:
    branches: [main, agent/build-family-os]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Mark live verification pending
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'live-pages-capture',
              description: 'Building before live UI tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: yarn install --non-interactive --no-progress
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Report build failure to live verification status
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'live-pages-capture',
              description: 'Build failed before live UI tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser test driver
        run: yarn add --no-lock --ignore-scripts --non-interactive puppeteer-core
      - name: Exercise capture fields on live Pages site
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-capture-smoke.mjs "$LIVE_URL"
      - name: Exercise calendar planner on live Pages site
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-calendar-smoke.mjs "$LIVE_URL"
      - name: Exercise health providers on live Pages site
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-health-smoke.mjs "$LIVE_URL"
      - name: Publish live smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'live-pages-capture',
              description: passed ? 'Live capture + calendar + health tests passed' : 'Live UI smoke test failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
